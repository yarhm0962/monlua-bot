name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Install and build deobfuscator runtimes
        run: bash scripts/setup_render_runtimes.sh
      - name: Compile Python modules
        run: python -m compileall -q bot.py run.py deobf/obfuscators deobf/moonveil deobf/v151/core
      - name: Check Ironveil v1 and its known-good sample
        run: |
          .runtime/node/bin/node --check .runtime/vendor/ironveil/deobfuscator/index.js
          for file in .runtime/vendor/ironveil/deobfuscator/utils/*.js; do .runtime/node/bin/node --check "$file"; done
          .runtime/node/bin/node .runtime/vendor/ironveil/deobfuscator/index.js .runtime/vendor/ironveil/Samples/obf.lua "$RUNNER_TEMP/ironveil-output.lua"
          cmp "$RUNNER_TEMP/ironveil-output.lua" .runtime/vendor/ironveil/Samples/deobfuscated.lua
      - name: Check 77fuscator bytecode lifting and Lua 5.1 source conversion
        run: |
          .runtime/dotnet/dotnet .runtime/77fuscator/deobfuscator.dll .runtime/vendor/77fuscator/tests/hello-obfuscated.lua -o "$RUNNER_TEMP/77fuscator-output.luac" --strings
          test -s "$RUNNER_TEMP/77fuscator-output.luac"
          .runtime/java/bin/java -jar deobf/bin/unluac.jar "$RUNNER_TEMP/77fuscator-output.luac" > "$RUNNER_TEMP/77fuscator-output.lua"
          test -s "$RUNNER_TEMP/77fuscator-output.lua"
      - name: Check IronBrew2 Linux runtime and bytecode generation
        run: |
          export LD_LIBRARY_PATH=".runtime/vendor/ironbrew2/runtimes/linux-x64/native:${LD_LIBRARY_PATH:-}"
          .runtime/dotnet/dotnet .runtime/vendor/ironbrew2/LuaAnalysis.Ironbrew2.dll .runtime/vendor/ironbrew2/input.lua "$RUNNER_TEMP/ironbrew2-output.luac"
          test -s "$RUNNER_TEMP/ironbrew2-output.luac"
      - name: Run bot regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Luraph runtime models
        run: |
          file deobf/v151/bin/luau deobf/v151/bin/luau-ast
          ldd deobf/v151/bin/luau || true
          python -u deobf/v151/tests/test_datatypes.py
          deobf/v151/bin/luau deobf/v151/tests/test_for_lowering.luau
      - name: Run Luraph v15.1 sample regression
        run: python deobf/v151/tests/run_samples.py
