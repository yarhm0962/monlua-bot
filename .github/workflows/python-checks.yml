name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
      - name: Set up .NET runtimes
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
      - name: Install bot dependencies
        run: python -m pip install -r requirements.txt
      - name: Prepare portable Luraph v15.1 Luau runtime
        run: |
          if [ ! -x deobf/v151/bin/luau ] || [ ! -x deobf/v151/bin/luau-ast ]; then
            python deobf/v151/build_luau.py --portable --jobs 2
          fi
          chmod +x deobf/v151/bin/luau deobf/v151/bin/luau-ast
          chmod +x deobf/bin/luau deobf/bin/luau-ast
      - name: Materialize added engine sources
        run: bash scripts/materialize_engine_assets.sh
      - name: Build 77fuscator and restore IronBrew2 runtime dependencies
        run: |
          dotnet publish .runtime/vendor/77fuscator/deobfuscator.csproj -c Release --no-self-contained -o .runtime/77fuscator
          dotnet restore deobf/ironbrew2/restore.csproj --packages .runtime/nuget
          python -c 'import json,pathlib; pathlib.Path(".runtime/vendor/ironbrew2/LuaAnalysis.Ironbrew2.runtimeconfig.dev.json").write_text(json.dumps({"runtimeOptions":{"additionalProbingPaths":[str(pathlib.Path(".runtime/nuget").resolve())]}}))'
      - name: Check Ironveil JavaScript
        run: |
          node --check .runtime/vendor/ironveil/index.js
          for file in .runtime/vendor/ironveil/utils/*.js; do node --check "$file"; done
      - name: Compile Python modules
        run: python -m compileall -q bot.py deobf/obfuscators deobf/moonveil deobf/v151/core
      - name: Check Luraph Node.js modules
        run: |
          node --check deobf/v151/deob.js
          for file in deobf/v151/src/*.js; do node --check "$file"; done
      - name: Run bot regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate Luraph runtime models
        run: |
          file deobf/v151/bin/luau deobf/v151/bin/luau-ast
          ldd deobf/v151/bin/luau || true
          python -u deobf/v151/tests/test_datatypes.py
          deobf/v151/bin/luau deobf/v151/tests/test_for_lowering.luau
      - name: Run Luraph v15.1 sample regression
        run: python deobf/v151/tests/run_samples.py
      - name: Commit portable Luraph runtime binaries
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deobf/v151/bin/luau deobf/v151/bin/luau-ast
          if ! git diff --cached --quiet; then
            git commit -m "Build portable Luraph v15.1 runtime binaries [skip ci]"
            git push origin HEAD:main
          fi
